<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>霧林市警政檔案庫</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

<header class="government-header">
    <div class="header-inner">
        <h1>霧林市警政檔案庫</h1>
        <p>Wulin City Police Archive System</p>
    </div>
</header>


<nav class="main-nav">
    <button data-page="home">首頁</button>
    <button data-page="archive">案件檔案</button>
    <button data-page="person">人物資料</button>
    <button data-page="evidence">證物資料</button>
    <button data-page="search">資料搜尋</button>
</nav>


<main>

<section id="home" class="page active">

<div class="notice-box">
<h2>系統公告</h2>

<p>
本系統為霧林市警察局內部檔案管理平台。
</p>

<p>
所有資料皆屬機密文件，未經授權禁止外流。
</p>
</div>


<div class="dashboard">

<div class="card">
<h3>案件數量</h3>
<span id="caseCount">0</span>
</div>


<div class="card">
<h3>相關人物</h3>
<span id="personCount">0</span>
</div>


<div class="card">
<h3>證物紀錄</h3>
<span id="evidenceCount">0</span>
</div>

</div>


<div class="recent">

<h2>最新更新紀錄</h2>

<ul id="recentList">
</ul>

</div>


</section>



<section id="archive" class="page">

<h2>案件檔案庫</h2>

<div class="filter-area">

<input 
id="caseSearch"
type="text"
placeholder="搜尋案件名稱..."
>


<select id="caseStatus">

<option value="all">
全部狀態
</option>

<option value="open">
調查中
</option>

<option value="closed">
已結案
</option>

<option value="unknown">
未分類
</option>

</select>

</div>


<div id="caseList" class="archive-list">

</div>


</section>



<section id="person" class="page">

<h2>人物資料庫</h2>


<div class="filter-area">

<input 
id="personSearch"
type="text"
placeholder="搜尋人物..."
>

</div>


<div id="personList" class="archive-list">

</div>


</section>



<section id="evidence" class="page">

<h2>證物資料庫</h2>


<div id="evidenceList" class="archive-list">

</div>


</section>



<section id="search" class="page">

<h2>全域搜尋</h2>


<input 
id="globalSearch"
type="text"
placeholder="輸入關鍵字..."
>


<div id="searchResult">

</div>


</section>


</main>


<footer>

<p>
霧林市警察局資料管理中心 © 2026
</p>

</footer>


</div>


<script src="main.js"></script>

</body>
</html>

<!-- 案件資料詳細視窗 -->

<div id="caseModal" class="modal">

<div class="modal-content">

<button class="close-modal">
×
</button>


<h2 id="modalCaseTitle">
案件名稱
</h2>


<div class="detail-section">

<h3>案件編號</h3>
<p id="modalCaseId"></p>

</div>


<div class="detail-section">

<h3>案件狀態</h3>
<p id="modalCaseStatus"></p>

</div>


<div class="detail-section">

<h3>案件描述</h3>
<p id="modalCaseDescription"></p>

</div>


<div class="detail-section">

<h3>相關人物</h3>
<ul id="modalCasePersons"></ul>

</div>


<div class="detail-section">

<h3>證物列表</h3>
<ul id="modalCaseEvidence"></ul>

</div>


</div>

</div>



<!-- 人物詳細視窗 -->

<div id="personModal" class="modal">


<div class="modal-content">


<button class="close-person-modal">
×
</button>


<h2 id="modalPersonName">
人物名稱
</h2>


<div class="detail-section">

<h3>身份</h3>

<p id="modalPersonRole"></p>

</div>


<div class="detail-section">

<h3>人物檔案</h3>

<p id="modalPersonDescription"></p>

</div>


<div class="detail-section">

<h3>關聯案件</h3>

<ul id="modalPersonCases"></ul>

</div>


</div>


</div>



<!-- 警告訊息 -->

<div id="systemAlert"
class="system-alert">

</div>


</body>

</html>
